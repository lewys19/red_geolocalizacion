# Integración continua de Altoque: en cada push y pull request
#   1. pruebas del backend contra PostgreSQL + PostGIS y Redis reales
#   2. lint, pruebas y compilación de la web
#   3. construcción de las imágenes Docker (detecta un Dockerfile roto antes de llegar a main)
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Si llega otro push a la misma rama, cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + PostGIS)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_DB: altoque
          POSTGRES_USER: altoque
          POSTGRES_PASSWORD: altoque
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U altoque" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://altoque:altoque@localhost:5432/altoque
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Las migraciones coinciden con los modelos
        run: alembic upgrade head && alembic check
        env:
          SECRET_KEY: clave-de-ci-de-al-menos-32-caracteres-xx
      - run: pytest -q

  web:
    name: Web (lint, pruebas y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  imagenes:
    # Construye las imágenes en cada push (un Dockerfile roto se detecta en la rama),
    # pero solo las sube a GHCR cuando el push es a main (producción).
    name: Imagen Docker (${{ matrix.servicio }})
    needs: [backend, web]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - servicio: api
            carpeta: backend
          - servicio: web
            carpeta: web
    env:
      SUBIR: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - if: env.SUBIR == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Etiquetas: "latest" (lo que descarga el VPS) y el hash del commit (para volver a una versión anterior).
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/altoque-${{ matrix.servicio }}
          tags: |
            type=raw,value=latest,enable=${{ env.SUBIR }}
            type=sha,format=long,prefix=
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.carpeta }}
          push: ${{ env.SUBIR == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.carpeta }}
          cache-to: type=gha,mode=max,scope=${{ matrix.carpeta }}
